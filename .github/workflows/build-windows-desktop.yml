# DeepSeek Harness (DSH) — Windows x64 桌面版在线编译
#
# 用法：
#   1. 将本文件放入你 fork 的仓库： .github/workflows/build-windows-desktop.yml
#   2. 仓库页 → Actions → "Build Windows desktop (unsigned)" → Run workflow
#   3. 构建完成后，在该次运行页面底部的 Artifacts 下载 *.exe 安装包
#
# 说明：
#   - 改编自官方 .github/workflows/windows-package.yml（官方跑在自托管 runner 上，
#     此处改为 GitHub 托管 windows-latest，无需任何自建环境与凭据）。
#   - 产物为未签名(unsigned)的 NSIS 安装器；官方发布版带签名，自编译版安装时会有
#     SmartScreen 提示，属正常现象。
#   - policy_origin / login_origins 只是写进安装包的"更新策略"配置（运行时才使用），
#     构建过程仅做格式校验、不联网访问，自用时保持默认占位值即可。

name: Build Windows desktop (unsigned)

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: '版本号：auto=自动生成；否则输入完整版本（如 1.2.3）'
        type: string
        default: auto
        required: true
      deployment:
        description: '更新策略环境'
        type: choice
        options: [test, production]
        default: test
        required: true
      policy_origin:
        description: '更新策略 HTTPS origin（仅协议+域名，不带路径；构建时只校验格式）'
        type: string
        default: https://example.com
        required: true
      login_origins:
        description: 'deployment=test 时必填：逗号分隔的登录 HTTPS origin'
        type: string
        default: https://example.com
        required: false
  # 如需打 tag 自动构建，取消下面注释：
  # push:
  #   tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-desktop-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        id: checkout
        with:
          persist-credentials: false
          clean: true

      # pnpm 版本自动读取根 package.json 的 packageManager 字段 (pnpm@11.28.5)
      - name: Setup pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Node 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE

      # 官方脚本：校验输入 → 生成 apps/desktop/.env.windows → 输出版本号
      - name: Validate inputs and prepare public package settings
        id: settings
        env:
          PACKAGE_BUILD_VERSION: ${{ inputs.build_version }}
          PACKAGE_DEPLOYMENT: ${{ inputs.deployment }}
          PACKAGE_POLICY_ORIGIN: ${{ inputs.policy_origin }}
          PACKAGE_LOGIN_ORIGINS: ${{ inputs.login_origins }}
        run: node apps/desktop/scripts/prepare-windows-ci.mjs

      # 干跑校验：打包配置与工具链检查（不产出安装包）
      - name: Check packaging configuration and toolchain
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          pnpm run package:desktop:win:x64:unsigned --check --build-version "$env:PACKAGE_VERSION"
          exit $LASTEXITCODE

      # 正式构建：tsc + tsdown + 准备运行时 + electron-builder 打出 NSIS 安装器
      - name: Build installer and verify packaged runtime
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          pnpm run package:desktop:win:x64:unsigned --build-version "$env:PACKAGE_VERSION"
          exit $LASTEXITCODE

      # 打包诊断日志（失败时排查用）
      - name: Retain packaging diagnostics
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14

      # 最终安装包（.exe），在运行页面 Artifacts 区下载
      - name: Retain verified installer
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-x64-unsigned-${{ steps.settings.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Remove generated package settings
        if: always() && steps.checkout.outcome == 'success'
        run: |
          if (Test-Path -LiteralPath apps/desktop/.env.windows) {
            Remove-Item -LiteralPath apps/desktop/.env.windows
          }
