# DeepSeek Harness (DSH) — Windows x64 桌面版在线编译
#
# 用法：
#   1. 将本文件放入你 fork 的仓库： .github/workflows/build-windows-desktop.yml
#   2. 仓库页 → Actions → "Build Windows desktop (unsigned)" → Run workflow（全部默认即可）
#   3. 构建完成后，在该次运行页面底部的 Artifacts 下载 *.exe 安装包
#
# 说明：
#   - 基于官方工作流 .github/workflows/windows-package.yml（"Package Desktop · Windows"，
#     对齐上游 2026-10-22 修订版）适配 GitHub 托管 runner：
#     · runner 改为 windows-latest（官方用自托管打包机 dsh-win-package-trial）
#     · 签名固定 unsigned：官方 signed 需要 EV 硬件令牌，托管环境无此硬件；
#       官方定位 unsigned 为"仅限内部调试，禁止发布/自动更新"——正是自编译用途
#     · 机器预设固定 test：官方预设文件放在打包机的 DSH_PACKAGING_CONFIG_DIR 目录下，
#       此处改为 CI 第一步自动生成（内容为官方认可的 test 预设四项配置）
#     · 压缩等级写死 3（与官方默认一致：3 打包快，7 更省体积）
#     · 更新策略 origin 用占位值 https://example.com：构建时仅做本地格式校验、不联网；
#       运行时连不上 = 永远不会强制更新，正适合自编译场景
#   - 产物为未签名 NSIS 安装器（local 构建档，界面标注 "DSH Local Build"，非调试构建），
#     安装时 SmartScreen 告警属正常现象。
#
# 相比官方工作流有意省略（均为自托管机专用优化，托管 runner 不需要）：
#   · cache_namespace / build_root 输入及独立构建副本机制（不启用时目录即默认工作区）
#   · packaging helpers 提取与 windows-packaging-priority.ps1 进程提权（BestEffort 性能优化）
#   · persistent pnpm store 配置（已用 setup-node 的 pnpm 缓存覆盖）
#   · artifact 上传保留官方新增的 compression-level: 0（exe 已压缩，跳过二次压缩）
#
# 注意（官方行为，非 bug）：
#   · update_channel 选 latest 时要求稳定版本号（不含预发布后缀），
#     默认 version_mode=default + preset=test 会自动生成带日期的版本，与 latest 冲突；
#     如需 latest 请把 version_mode 设为 product 或 manual 并给稳定版本。
#   · 打 tag（dsh-v*）构建请在手动触发时把 source_ref 填为该标签；
#     source_ref 也可以填仓库内的分支名（test 预设支持），不能填 SHA 或 PR ref。

name: Build Windows desktop (unsigned)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: '构建来源：master 或含 Desktop CI 适配器的 dsh-v* 标签'
        type: string
        default: 'master'
        required: true
      update_channel:
        description: '安装包更新渠道（latest 需稳定版本，见顶部说明）'
        type: choice
        options: [nightly, latest]
        default: nightly
        required: true
      version_mode:
        description: '版本模式：default=自动；product=跟随仓库版本；manual=手动指定'
        type: choice
        options: [default, product, auto, manual]
        default: default
        required: true
      build_version:
        description: '仅 version_mode=manual 时填写：仓库版本号或其支持的预发布后缀'
        type: string
        default: ''
        required: false
  # 如需 push 自动构建请取消注释；push 触发时 inputs 为空，env 已做默认值兜底：
  # push:
  #   tags: ['dsh-v*']

permissions:
  contents: read

concurrency:
  group: windows-desktop-package
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      # 「|| 默认值」兜底：手动触发取 inputs；push 触发时 inputs 为空自动落默认
      PACKAGE_SOURCE_REF: ${{ inputs.source_ref || 'master' }}
      PACKAGE_VERSION_MODE: ${{ inputs.version_mode || 'default' }}
      DSH_DESKTOP_UPDATE_CHANNEL: ${{ inputs.update_channel || 'nightly' }}
      # 写死：托管 runner 只做未签名构建；预设固定 test（配置文件由下方步骤生成）
      PACKAGE_SIGNING: 'unsigned'
      DSH_PACKAGING_PRESET: test
      # 安装器压缩等级（官方 2026-10-22 新增参数：3 打包快 / 7 体积小，官方默认 3）
      PACKAGE_WINDOWS_COMPRESSION_LEVEL: '3'
      DSH_TELEMETRY_DISABLED: '1'
    steps:
      # 官方预设文件在打包机的 DSH_PACKAGING_CONFIG_DIR 下；托管 runner 每次全新，
      # 这里自动生成 test 预设（四项均通过官方 validateDesktopPackageEnvironment 校验）
      - name: Create test packaging preset
        run: |
          $configDir = Join-Path $env:RUNNER_TEMP 'dsh-packaging-config'
          New-Item -ItemType Directory -Force -Path (Join-Path $configDir 'presets') | Out-Null
          @'
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://example.com
          DSH_DESKTOP_MANDATORY_UPDATE_CONFIG={"allowedAuthOrigins":["https://example.com"]}
          '@ | Set-Content -Path (Join-Path $configDir 'presets/test.env') -Encoding utf8
          "DSH_PACKAGING_CONFIG_DIR=$configDir" | Add-Content $env:GITHUB_ENV

      # 照搬官方：清理 checkout 目录并校验其位置合法（防自托管机残留；托管机无害）
      - name: Reset packaging checkout
        working-directory: ${{ runner.temp }}
        run: |
          $workspace = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
          $parent = [IO.Path]::GetFullPath($env:RUNNER_WORKSPACE)
          if ([IO.Path]::GetDirectoryName($workspace) -ne $parent) { throw 'Checkout must be a direct child of RUNNER_WORKSPACE' }
          for ($item = [IO.DirectoryInfo]::new($workspace); $null -ne $item; $item = $item.Parent) {
            if ($item.Exists -and ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)) { throw 'Checkout ancestors cannot be links' }
          }
          node -e "const fs = require('node:fs'); fs.rmSync(process.argv[1], { recursive: true, force: true, maxRetries: 3 }); fs.mkdirSync(process.argv[1])" $workspace
          if ($LASTEXITCODE -ne 0) { throw 'Checkout cleanup failed' }

      - name: Checkout
        uses: actions/checkout@v7.0.1
        id: checkout
        with:
          persist-credentials: false
          clean: true
          ref: ${{ inputs.source_ref || 'master' }}

      # 照搬官方（2026-10-22 版）：校验预设、来源 ref 与 Desktop CI 适配器存在性
      - name: Validate selected source and adapter support
        run: >-
          node -e "const fs=require('node:fs'); const ref=process.env.PACKAGE_SOURCE_REF;
          const cp=require('node:child_process'); const preset=process.env.DSH_PACKAGING_PRESET;
          if(!['test','production'].includes(preset)) throw Error('Unknown packaging preset');
          const tag=/^dsh-v[0-9][0-9A-Za-z.-]*$/.test(ref);
          if(preset==='production' && ref!=='master' && !tag) throw Error('Production source must be master or dsh-v*');
          if(tag) {
          const v=JSON.parse(fs.readFileSync('package.json','utf8')).version;
          if(ref!=='dsh-v'+v) throw Error('Source tag must match product version');
          const tagged=cp.execFileSync('git',['rev-parse','--verify','refs/tags/'+ref+'^{commit}'],{encoding:'utf8'}).trim();
          const head=cp.execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          if(tagged!==head) throw Error('Checkout does not match source tag');
          } else {
          const branch=cp.execFileSync('git',['rev-parse','--abbrev-ref','HEAD'],{encoding:'utf8'}).trim();
          if(branch==='HEAD' || branch!==ref || ref.startsWith('refs/')) throw Error('Select a branch in this repository, not a SHA or PR ref');
          }
          if(!fs.readFileSync('apps/desktop/scripts/desktop-ci-version.mjs','utf8').includes('PACKAGE_VERSION_MODE')) throw Error('Source lacks Desktop channel/version CI support; select a newer release');"

      # pnpm 版本自动读取根 package.json 的 packageManager 字段
      - name: Setup pnpm
        uses: pnpm/action-setup@v5.0.0
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Node 24
        uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install locked dependencies
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE

      # 官方脚本：校验预设/签名选择 → 读取 preset 配置 → 解析并校验版本号
      - name: Validate preset and resolve build version
        id: settings
        env:
          # 仅 version_mode=manual 时需要；其余模式下留空即可
          PACKAGE_BUILD_VERSION: ${{ inputs.build_version }}
        run: node apps/desktop/scripts/prepare-windows-ci.mjs

      # 干跑校验：打包配置与工具链检查（不产出安装包）
      - name: Check packaging configuration and toolchain
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          $packageArgs = @('run', 'package:desktop:win:x64', '--check', '--build-version', $env:PACKAGE_VERSION)
          if ($env:PACKAGE_SIGNING -eq 'unsigned') { $packageArgs += '--unsigned' }
          pnpm @packageArgs
          exit $LASTEXITCODE

      # 正式构建：tsc + tsdown + 准备运行时 + electron-builder 打出 NSIS 安装器
      - name: Build installer and verify packaged runtime
        env:
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: |
          $packageArgs = @('run', 'package:desktop:win:x64', '--build-version', $env:PACKAGE_VERSION)
          if ($env:PACKAGE_SIGNING -eq 'unsigned') { $packageArgs += '--unsigned' }
          pnpm @packageArgs
          exit $LASTEXITCODE

      # 照搬官方：将成品从 checkout 移出到持久目录（脚本会输出 directory 供上传步骤使用）
      - name: Retain complete package outside the checkout
        id: retained
        env:
          PACKAGE_SOURCE_SHA: ${{ steps.checkout.outputs.commit }}
          PACKAGE_VERSION: ${{ steps.settings.outputs.version }}
        run: node --import tsx apps/desktop/scripts/retain-desktop-ci.ts

      # 打包诊断日志（失败时排查用）
      - name: Retain packaging diagnostics
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-package-logs-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      # 最终安装包（.exe），在运行页面 Artifacts 区下载
      - name: Retain verified unsigned installer
        if: success()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: windows-x64-unsigned-${{ steps.settings.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          include-hidden-files: true
          path: ${{ steps.retained.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
